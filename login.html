<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GPS Auto Tracking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="/" class="nav-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <div class="brand-text">Auto<span>Track</span></div>
            </a>
            <ul class="nav-links">
                <li><a href="/register" class="nav-link">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 3rem 1.5rem;">
        <div class="glass-card" style="width:100%; max-width:440px;">
            <div style="text-align:center; margin-bottom:2rem;">
                <h2 style="font-size:2rem; margin-bottom:0.5rem;">Welcome Back</h2>
                <p style="color:var(--text-muted); font-size:0.95rem;">Sign in to access your passenger or driver dashboard</p>
            </div>

            <form action="/login" method="post" id="loginForm" onsubmit="handleStaticLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding:0.9rem; font-size:1.05rem;" id="btnLoginSubmit">
                    Sign In
                </button>
            </form>

            <!-- Quick Demo One-Click Fillers for Project Presentation -->
            <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border-glass);">
                <div style="font-size:0.8rem; text-transform:uppercase; color:var(--text-dim); text-align:center; letter-spacing:0.05em; margin-bottom:0.8rem;">
                    Quick Demo Credentials (1-Click Fill)
                </div>
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('passenger@autotrack.com', 'password123')">
                        👤 Fill Demo Passenger (Rahul)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('rajesh@autotrack.com', 'password123')">
                        🛺 Fill Demo Driver 1 (Rajesh - Available)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('suresh@autotrack.com', 'password123')">
                        🛺 Fill Demo Driver 2 (Suresh - Available)
                    </button>
                </div>
            </div>

            <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-muted);">
                Don't have an account? <a href="/register" style="font-weight:600;">Create one here</a>
            </div>
        </div>
    </main>

    <script>
        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        function handleStaticLogin(e) {
            // When hosted on Vercel without Spring Boot backend running
            const email = document.getElementById('email').value.toLowerCase();
            if (window.location.hostname.includes('vercel.app') || window.location.port !== '8080') {
                e.preventDefault();
                if (email.includes('driver') || email.includes('rajesh') || email.includes('suresh') || email.includes('ali')) {
                    window.location.href = '/driver/dashboard';
                } else {
                    window.location.href = '/passenger/dashboard';
                }
            }
        }
    </script>
</body>
</html>
