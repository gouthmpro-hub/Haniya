# ===================================================================
# Development / Zero-Setup Fallback Profile (H2 In-Memory Database)
# Run with: mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
# ===================================================================
server.port=8080
spring.application.name=gps-auto-tracking-dev

# H2 In-Memory Database (zero configuration, instant startup)
spring.datasource.url=jdbc:h2:mem:autotracking_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Thymeleaf Settings
spring.thymeleaf.cache=false

# Auto Tracking Business Logic Configuration
autotracking.stale-location-timeout-seconds=120
autotracking.average-speed-kmh=25.0
autotracking.max-search-radius-km=25.0
