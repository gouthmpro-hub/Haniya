# ===================================================================
# GPS-Based Auto Tracking System - Application Configuration
# ===================================================================
server.port=8080
spring.application.name=gps-auto-tracking

# -------------------------------------------------------------------
# Primary Database: MySQL Configuration
# -------------------------------------------------------------------
# Make sure MySQL server is running and the database 'auto_tracking_db' exists.
# CREATE DATABASE IF NOT EXISTS auto_tracking_db;
spring.datasource.url=jdbc:mysql://localhost:3306/auto_tracking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 for MySQL/H2

# -------------------------------------------------------------------
# Thymeleaf Template Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Auto Tracking Business Logic Configuration
# -------------------------------------------------------------------
# Stale driver location expiration threshold in seconds (e.g. 120s = 2 minutes)
# Drivers who haven't updated coordinates within this window are hidden from nearby search
autotracking.stale-location-timeout-seconds=120

# Assumed average auto-rickshaw city speed in km/h for approximate ETA calculation
autotracking.average-speed-kmh=25.0

# Maximum nearby search radius in kilometers (upper limit clamp)
autotracking.max-search-radius-km=25.0

# -------------------------------------------------------------------
# Real SMS Gateway Configuration (Dispatches OTP directly to Mobile Phone)
# -------------------------------------------------------------------
# Option 1: Fast2SMS (Indian SMS API)
# Get free API key from https://fast2sms.com
sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# Option 2: Twilio Gateway (International & Indian SMS)
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

