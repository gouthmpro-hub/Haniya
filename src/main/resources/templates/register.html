<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | GPS Auto Tracking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a th:href="@{/login}" href="/login" class="nav-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <div class="brand-text">Auto<span>Track</span></div>
            </a>
            <ul class="nav-links">
                <li><a th:href="@{/login}" href="/login" class="nav-link">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 3rem 1.5rem;">
        <div class="glass-card" style="width:100%; max-width:460px;">
            <div style="text-align:center; margin-bottom:1.8rem;">
                <div class="hero-badge" style="margin-bottom:0.7rem;">Quick Account Registration</div>
                <h2 style="font-size:2rem; margin-bottom:0.4rem;">Create Account</h2>
                <p style="color:var(--text-muted); font-size:0.95rem;">Join to discover and track nearby auto-rickshaws on the live Google Map.</p>
            </div>

            <form id="registerForm" onsubmit="handleDirectRegister(event)">
                <!-- Full Name -->
                <div class="form-group" style="margin-bottom:1.1rem;">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required minlength="2" autofocus>
                </div>

                <!-- Phone Number -->
                <div class="form-group" style="margin-bottom:1.1rem;">
                    <label class="form-label" for="regPhone">Mobile Phone Number</label>
                    <div class="phone-input-group">
                        <div class="country-prefix">🇮🇳 +91</div>
                        <input type="tel" id="regPhone" class="form-control" placeholder="98470 12345" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group" style="margin-bottom:1.5rem;">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding:0.95rem; font-size:1.05rem;" id="btnRegSubmit">
                    Create Account & Open Radar &rarr;
                </button>
            </form>

            <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-muted);">
                Already have an account? <a th:href="@{/login}" href="/login" style="font-weight:600; color:var(--accent-amber);">Sign in here</a>
            </div>
        </div>
    </main>

    <script>
        async function handleDirectRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const rawPhone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const formattedPhone = rawPhone.startsWith('+') ? rawPhone : '+91 ' + rawPhone;

            const btn = document.getElementById('btnRegSubmit');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const profile = {
                name: name,
                phone: formattedPhone,
                email: formattedPhone.replace(/[^0-9]/g, '') + '@autotrack.phone',
                role: 'PASSENGER'
            };

            // 1. Try Spring Boot REST Registration
            try {
                await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: profile.name,
                        phone: profile.phone,
                        password: password,
                        role: 'PASSENGER'
                    })
                });
            } catch(err) {}

            // 2. Client-side storage for active session
            localStorage.setItem('autotrack_current_user', JSON.stringify(profile));

            // Save to registered users list
            try {
                let list = JSON.parse(localStorage.getItem('autotrack_registered_users')) || [];
                list = list.filter(u => u.phone !== formattedPhone);
                list.push(profile);
                localStorage.setItem('autotrack_registered_users', JSON.stringify(list));
            } catch(e) {
                localStorage.setItem('autotrack_registered_users', JSON.stringify([profile]));
            }

            // Redirect directly to live passenger tracking map
            window.location.href = window.location.port === '8080' ? '/passenger/dashboard' : '/passenger-dashboard.html';
        }
    </script>
</body>
</html>
