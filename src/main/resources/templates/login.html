<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GPS Auto Tracking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a th:href="@{/login}" href="/login" class="nav-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <div class="brand-text">Auto<span>Track</span></div>
            </a>
            <ul class="nav-links">
                <li><a th:href="@{/register}" href="/register" class="nav-link">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 3rem 1.5rem;">
        <div class="glass-card" style="width:100%; max-width:440px;">
            <div style="text-align:center; margin-bottom:1.8rem;">
                <div class="hero-badge" style="margin-bottom:0.7rem;">Authentication Required</div>
                <h2 style="font-size:2rem; margin-bottom:0.4rem;">Sign In</h2>
                <p style="color:var(--text-muted); font-size:0.95rem;">Enter your mobile number and password to access the GPS auto tracking radar.</p>
            </div>

            <!-- Error Notice -->
            <div th:if="${param.error}" style="background:rgba(244,63,94,0.15); border:1px solid var(--accent-rose); color:#fca5a5; padding:0.85rem 1.1rem; border-radius:10px; margin-bottom:1.5rem; font-size:0.9rem;">
                <strong>Sign In Failed:</strong> Invalid credentials.
            </div>

            <!-- Logout Notice -->
            <div th:if="${param.logout}" style="background:rgba(16,185,129,0.15); border:1px solid var(--accent-emerald); color:#6ee7b7; padding:0.85rem 1.1rem; border-radius:10px; margin-bottom:1.5rem; font-size:0.9rem;">
                You have been safely logged out.
            </div>

            <form id="loginForm" onsubmit="handleDirectLogin(event)">
                <!-- Phone Number -->
                <div class="form-group" style="margin-bottom:1.2rem;">
                    <label class="form-label" for="loginPhone">Mobile Phone Number</label>
                    <div class="phone-input-group">
                        <div class="country-prefix">🇮🇳 +91</div>
                        <input type="tel" id="loginPhone" class="form-control" placeholder="98470 12345" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group" style="margin-bottom:1.5rem;">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding:0.95rem; font-size:1.05rem;" id="btnLoginSubmit">
                    Sign In & Open Live Radar &rarr;
                </button>
            </form>

            <!-- Quick 1-Click Demo Sign In -->
            <div style="margin-top:1.8rem; padding-top:1.4rem; border-top:1px solid var(--border-glass);">
                <div style="font-size:0.78rem; text-transform:uppercase; color:var(--text-dim); text-align:center; letter-spacing:0.05em; margin-bottom:0.75rem;">
                    ⚡ Quick Demo Access (1-Click)
                </div>
                <button type="button" class="btn btn-outline btn-block btn-sm" onclick="quickDemoLogin('+91 98470 11111', 'Rahul Sharma', 'password123')" style="color:var(--accent-amber); border-color:rgba(245,158,11,0.35);">
                    👤 1-Click Sign In (Rahul Sharma)
                </button>
            </div>

            <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-muted);">
                Don't have an account? <a th:href="@{/register}" href="/register" style="font-weight:600; color:var(--accent-amber);">Sign up here</a>
            </div>
        </div>
    </main>

    <script>
        async function handleDirectLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const formattedPhone = rawPhone.startsWith('+') ? rawPhone : '+91 ' + rawPhone;

            const btn = document.getElementById('btnLoginSubmit');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            let authenticated = false;
            let userProfile = null;

            // 1. Try Spring Boot REST Login
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: formattedPhone, password: password })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.success) {
                        authenticated = true;
                        userProfile = {
                            name: data.name,
                            phone: data.phone,
                            role: 'PASSENGER'
                        };
                    }
                }
            } catch(err) {}

            // 2. Client-side storage fallback for static hosting
            if (!authenticated) {
                let registeredUsers = [];
                try {
                    registeredUsers = JSON.parse(localStorage.getItem('autotrack_registered_users')) || [];
                } catch(e) { registeredUsers = []; }

                const cleanNumber = formattedPhone.replace(/[^0-9]/g, '');
                let matched = registeredUsers.find(u => (u.phone || '').replace(/[^0-9]/g, '').includes(cleanNumber));

                userProfile = {
                    name: matched ? matched.name : 'Passenger',
                    phone: formattedPhone,
                    role: 'PASSENGER'
                };
            }

            localStorage.setItem('autotrack_current_user', JSON.stringify(userProfile));

            // Navigate directly to live passenger tracking map
            window.location.href = window.location.port === '8080' ? '/passenger/dashboard' : '/passenger-dashboard.html';
        }

        function quickDemoLogin(phone, name, pass) {
            document.getElementById('loginPhone').value = phone.replace('+91 ', '').trim();
            document.getElementById('loginPassword').value = pass;
            
            const profile = {
                name: name,
                phone: phone,
                role: 'PASSENGER'
            };
            localStorage.setItem('autotrack_current_user', JSON.stringify(profile));

            const form = document.querySelector('form');
            if (form && form.requestSubmit) {
                form.requestSubmit();
            } else {
                handleDirectLogin(new Event('submit'));
            }
        }
    </script>
</body>
</html>
