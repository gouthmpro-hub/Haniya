<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GPS Auto Tracking</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="/" class="nav-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <div class="brand-text">Auto<span>Track</span></div>
            </a>
            <ul class="nav-links">
                <li><a href="/login" class="nav-link">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 3rem 1.5rem;">
        <div class="glass-card" style="width:100%; max-width:520px;">
            <div style="text-align:center; margin-bottom:2rem;">
                <h2 style="font-size:2rem; margin-bottom:0.5rem;">Create Account</h2>
                <p style="color:var(--text-muted); font-size:0.95rem;">Join as a Passenger to find rides, or as an Auto Driver to share your live GPS location.</p>
            </div>

            <form action="/register" method="post" id="registrationForm" onsubmit="handleStaticRegister(event)">
                
                <!-- Role Selector -->
                <label class="form-label">I want to register as:</label>
                <div class="role-switch-container">
                    <label class="role-card-option active" id="optionPassenger">
                        <input type="radio" name="role" value="PASSENGER" checked onclick="selectRole('PASSENGER')">
                        <span class="role-icon">🚶</span>
                        <div class="role-title">Passenger</div>
                        <small style="color:var(--text-muted); font-size:0.75rem;">Find nearby autos</small>
                    </label>

                    <label class="role-card-option" id="optionDriver">
                        <input type="radio" name="role" value="DRIVER" onclick="selectRole('DRIVER')">
                        <span class="role-icon">🛺</span>
                        <div class="role-title">Auto Driver</div>
                        <small style="color:var(--text-muted); font-size:0.75rem;">Share GPS & get trips</small>
                    </label>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required minlength="2">
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="e.g. rahul@example.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                </div>

                <!-- Dynamic Driver Details -->
                <div id="driverFields" style="display:none; background:rgba(245,158,11,0.05); border:1px dashed rgba(245,158,11,0.3); border-radius:12px; padding:1.2rem; margin-bottom:1.4rem;">
                    <div style="font-weight:700; color:var(--accent-amber); font-size:0.9rem; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
                        <span>🛺</span> Driver Vehicle Details
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. +91 98470 12345">
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label" for="autoRegistrationNumber">Auto Registration Number</label>
                        <input type="text" id="autoRegistrationNumber" name="autoRegistrationNumber" class="form-control" placeholder="e.g. KL-07-CD-4521" style="text-transform:uppercase;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding:0.95rem; font-size:1.05rem;" id="btnSubmitRegister">
                    Create Account
                </button>
            </form>

            <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-muted);">
                Already have an account? <a href="/login" style="font-weight:600;">Sign in here</a>
            </div>
        </div>
    </main>

    <script>
        let currentRole = 'PASSENGER';

        function selectRole(role) {
            currentRole = role;
            const optPass = document.getElementById('optionPassenger');
            const optDriver = document.getElementById('optionDriver');
            const driverFields = document.getElementById('driverFields');
            const phoneInput = document.getElementById('phone');
            const autoRegInput = document.getElementById('autoRegistrationNumber');

            if (role === 'DRIVER') {
                optDriver.classList.add('active');
                optPass.classList.remove('active');
                driverFields.style.display = 'block';
                phoneInput.required = true;
                autoRegInput.required = true;
            } else {
                optPass.classList.add('active');
                optDriver.classList.remove('active');
                driverFields.style.display = 'none';
                phoneInput.required = false;
                autoRegInput.required = false;
            }
        }

        function handleStaticRegister(e) {
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            const autoRegInput = document.getElementById('autoRegistrationNumber');

            const name = nameInput ? nameInput.value.trim() : '';
            const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const autoReg = autoRegInput ? autoRegInput.value.trim().toUpperCase() : '';

            const profile = {
                name: name || (currentRole === 'DRIVER' ? 'Driver' : 'Passenger'),
                email: email,
                role: currentRole,
                phone: phone,
                autoRegistrationNumber: autoReg,
                available: true
            };

            // Save active session user
            localStorage.setItem('autotrack_current_user', JSON.stringify(profile));

            // Save to registered users list
            try {
                let list = JSON.parse(localStorage.getItem('autotrack_registered_users')) || [];
                list = list.filter(u => u.email !== email);
                list.push(profile);
                localStorage.setItem('autotrack_registered_users', JSON.stringify(list));
            } catch(err) {
                localStorage.setItem('autotrack_registered_users', JSON.stringify([profile]));
            }

            // If driver, strictly add to local registered driver fleet
            if (currentRole === 'DRIVER' && autoReg) {
                try {
                    let drivers = JSON.parse(localStorage.getItem('autotrack_drivers')) || [];
                    drivers = drivers.filter(d => d.autoRegistrationNumber !== autoReg);
                    drivers.push({
                        driverId: Date.now(),
                        driverName: profile.name,
                        email: email,
                        phone: phone,
                        autoRegistrationNumber: autoReg,
                        latitude: 9.9825 + (Math.random() * 0.006 - 0.003),
                        longitude: 76.2820 + (Math.random() * 0.006 - 0.003),
                        accuracy: 9.0,
                        available: true,
                        lastUpdated: new Date().toLocaleTimeString()
                    });
                    localStorage.setItem('autotrack_drivers', JSON.stringify(drivers));
                } catch(err) {
                    console.warn(err);
                }
            }

            if (window.location.hostname.includes('vercel.app') || window.location.port !== '8080') {
                e.preventDefault();
                alert('Account registered successfully for ' + profile.name + '! Redirecting to dashboard...');
                if (currentRole === 'DRIVER') {
                    window.location.href = '/driver-dashboard.html';
                } else {
                    window.location.href = '/passenger-dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
